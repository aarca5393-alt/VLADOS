<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Портфолио · НЕОН | Анимация перехода категории + проекты</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:300,400" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto Condensed', sans-serif;
            background: #07090e;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 3D НЕОНОВЫЙ ФОН */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0.7;
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc0IiBudW1PY3RhdmVzPSIzIiAvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNmKSIgb3BhY2l0eT0iMC4wMzUiIC8+PC9zdmc+');
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 2rem 8rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* ХЕДЕР */
        header {
            margin-bottom: 1rem;
            animation: neonGlow 1.8s ease-out;
        }

        @keyframes neonGlow {
            0% { opacity: 0; transform: translateY(-30px); filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .hello {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(0,255,255,0.5);
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            background: linear-gradient(to right, #ffffff, #b0f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,255,255,0.3);
            max-width: 900px;
            margin-bottom: 1rem;
        }

        /* КАРТОЧКИ-КАТЕГОРИИ */
        .categories-row {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
            margin: 2rem 0 1rem;
        }

        .category-card {
            background: rgba(8, 12, 20, 0.8);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 40px;
            padding: 1.8rem 1.8rem;
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,255,255,0.1);
        }

        .category-card:hover {
            transform: translateY(-10px);
            border-color: #ff00ff;
            box-shadow: 0 0 50px rgba(255,0,255,0.4);
            background: rgba(15, 20, 30, 0.9);
        }

        .category-card.active {
            border-color: #ff00ff;
            box-shadow: 0 0 40px #ff00ff, 0 0 20px #00ffff;
            background: rgba(25, 20, 40, 0.9);
        }

        .category-icon {
            font-size: 3.2rem;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .category-card:hover .category-icon {
            color: #ff00ff;
            text-shadow: 0 0 50px #ff00ff;
            transform: scale(1.1) rotate(5deg);
        }

        .category-card h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #fff, #a5f3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .category-card p {
            color: #b0d0ff;
            font-size: 0.95rem;
        }

        /* КОНТЕЙНЕРЫ ПРОЕКТОВ - С ПЛАВНОЙ ВЫСОТОЙ */
        .projects-container {
            width: 100%;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            display: none;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                        transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                        max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        margin 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 0;
            overflow: hidden;
        }

        .projects-container.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            max-height: 2500px;
            animation: slideDown 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .projects-container.closing {
            display: block;
            opacity: 0;
            transform: translateY(-20px);
            max-height: 0;
            margin-top: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            transition: opacity 0.6s ease-in,
                        transform 0.4s ease-in,
                        max-height 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                        margin 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            overflow: hidden;
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-30px); max-height: 0; }
            100% { opacity: 1; transform: translateY(0); max-height: 2500px; }
        }

        .projects-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0,255,255,0.2);
            transition: margin 0.5s, padding 0.5s;
        }

        .projects-container.closing .projects-header {
            margin-bottom: 0;
            padding-bottom: 0;
            opacity: 0;
        }

        .projects-header h3 {
            font-size: 1.6rem;
            font-weight: 600;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .projects-count {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* ГОРИЗОНТАЛЬНЫЙ СКРОЛЛ ПРОЕКТОВ */
        .projects-scroll {
            display: flex;
            gap: 2rem;
            overflow-x: auto;
            padding: 0.8rem 0.5rem 1.5rem;
            scroll-behavior: smooth;
            transition: padding 0.5s, opacity 0.3s;
        }

        .projects-container.closing .projects-scroll {
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
        }

        .projects-scroll::-webkit-scrollbar {
            height: 6px;
        }

        .projects-scroll::-webkit-scrollbar-track {
            background: rgba(0,255,255,0.08);
            border-radius: 10px;
        }

        .projects-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border-radius: 10px;
            box-shadow: 0 0 20px #00ffff;
        }

        .project-card {
            min-width: 300px;
            width: 300px;
            background: rgba(12, 16, 25, 0.8);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(0, 255, 255, 0.25);
            border-radius: 28px;
            padding: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .project-card:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 40px rgba(255,0,255,0.3);
            transform: translateY(-8px) scale(1.02);
            background: rgba(20, 25, 40, 0.9);
        }

        .project-card.active {
            border-color: #ff00ff;
            box-shadow: 0 0 40px #ff00ff;
            background: rgba(30, 20, 45, 0.9);
        }

        .project-icon {
            font-size: 2.2rem;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 1rem;
        }

        .project-card h4 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: white;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.8rem 0;
        }

        .tag {
            background: rgba(0,255,255,0.08);
            border: 1px solid rgba(0,255,255,0.2);
            border-radius: 30px;
            padding: 0.25rem 1rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: #a5f3fc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ДЕТАЛЬНЫЙ ПРОСМОТР - С ПЛАВНОЙ ВЫСОТОЙ И ПЕРЕХОДОМ */
        .detail-container {
            width: 100%;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                        transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                        max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        margin 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 0;
            overflow: hidden;
        }

        .detail-container.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            max-height: 2000px;
            animation: fadeDetail 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .detail-container.closing {
            display: block;
            opacity: 0;
            transform: translateY(20px);
            max-height: 0;
            margin-top: 0;
            margin-bottom: 0;
            transition: opacity 0.4s ease-in,
                        transform 0.4s ease-in,
                        max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        margin 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            overflow: hidden;
        }

        @keyframes fadeDetail {
            0% { opacity: 0; transform: translateY(20px); max-height: 0; }
            100% { opacity: 1; transform: translateY(0); max-height: 2000px; }
        }

        .detail-card {
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(20px);
            border: 2px solid;
            border-image: linear-gradient(45deg, #00ffff, #ff00ff) 1;
            border-radius: 32px;
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            box-shadow: 0 0 60px rgba(255,0,255,0.2);
            transition: padding 0.5s;
        }

        .detail-container.closing .detail-card {
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
        }

        .screenshot-area {
            background: rgba(0,0,0,0.4);
            border-radius: 24px;
            border: 1px solid rgba(0,255,255,0.2);
            padding: 1rem;
        }

        .main-shot {
            width: 100%;
            aspect-ratio: 16/10;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(0,255,255,0.3);
            border: 1px solid rgba(0,255,255,0.2);
            margin-bottom: 1rem;
        }

        .thumbnails-row {
            display: flex;
            gap: 0.8rem;
        }

        .thumb {
            width: 70px;
            height: 50px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            border: 1px solid rgba(0,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0,255,255,0.3);
            transition: all 0.2s;
        }

        .thumb:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
        }

        .project-detail-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .detail-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #fff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .detail-desc {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .tech-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .tech-item {
            background: rgba(255,0,255,0.08);
            border: 1px solid #ff00ff;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #ffb3ff;
            box-shadow: 0 0 15px rgba(255,0,255,0.2);
        }

        .feature-list {
            list-style: none;
        }

        .feature-list li {
            margin-bottom: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #e0f2fe;
        }

        .feature-list i {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        /* ============ НЕОНОВАЯ КЛАВИАТУРА ============ */
        .contact-section {
            position: relative;
            width: 100%;
            margin-top: 5rem;
            margin-bottom: 2rem;
            z-index: 20;
        }

        .contact-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,255,255,0.3);
        }

        .neon-keyboard {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            perspective: 1000px;
        }

        .neon-key {
            list-style: none;
            width: 180px;
            height: 180px;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }

        .neon-key a {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 25, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 20px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            transform: rotateX(10deg) rotateY(0deg);
            color: #00ffff;
        }

        .neon-key a i {
            font-size: 3.5rem;
            margin-bottom: 0.8rem;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            transition: all 0.3s;
        }

        .neon-key a span {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            background: linear-gradient(45deg, #fff, #a5f3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .neon-key a:hover {
            transform: rotateX(5deg) rotateY(-5deg) translateZ(20px);
            border-color: #ff00ff;
            box-shadow:
                0 0 40px rgba(255, 0, 255, 0.5),
                inset 0 0 30px rgba(255, 0, 255, 0.3);
            background: rgba(20, 10, 30, 0.8);
        }

        .neon-key a:hover i {
            color: #ff00ff;
            text-shadow: 0 0 30px #ff00ff;
            transform: scale(1.1);
        }

        .neon-key a::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 4px;
            right: 4px;
            height: 12px;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 0 0 15px 15px;
            filter: blur(4px);
            transition: all 0.3s;
            z-index: -1;
        }

        .neon-key a:hover::before {
            background: rgba(255, 0, 255, 0.3);
            bottom: -12px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .neon-key a::after {
            content: '';
            position: absolute;
            left: -8px;
            top: 4px;
            bottom: 4px;
            width: 12px;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 15px 0 0 15px;
            filter: blur(4px);
            transition: all 0.3s;
            z-index: -1;
        }

        .neon-key a:hover::after {
            background: rgba(255, 0, 255, 0.3);
            left: -12px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        /* Кастомный курсор */
        .custom-cursor {
            width: 25px;
            height: 25px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            box-shadow: 0 0 20px #00ffff;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, border-color 0.2s;
        }

        @media (max-width: 900px) {
            h1 { font-size: 2.5rem; }
            .detail-card { grid-template-columns: 1fr; }
            .category-card { width: 220px; }
            .neon-key { width: 140px; height: 140px; }
            .neon-key a i { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .neon-keyboard { gap: 1rem; }
            .neon-key { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="noise"></div>
    <div class="custom-cursor" id="neonCursor"></div>

    <div class="container">
        <header>
            <span class="hello"><i class="fas fa-bolt"></i> NEON DEV</span>
            <h1>Портфолио · Анимация перехода</h1>
        </header>

        <!-- КАРТОЧКИ-КАТЕГОРИИ -->
        <div class="categories-row">
            <div class="category-card" data-category="sites">
                <div class="category-icon"><i class="fas fa-globe"></i></div>
                <h2>Сайты</h2>
                <p>9 проектов • адаптив • анимация</p>
            </div>
            <div class="category-card" data-category="bots">
                <div class="category-icon"><i class="fas fa-robot"></i></div>
                <h2>Боты</h2>
                <p>6 проектов • Telegram • API</p>
            </div>
            <div class="category-card" data-category="automations">
                <div class="category-icon"><i class="fas fa-magic"></i></div>
                <h2>Автоматизации</h2>
                <p>5 решений • документы • скрипты</p>
            </div>
        </div>

        <!-- КОНТЕЙНЕРЫ ПРОЕКТОВ -->
        <div id="projects-sites" class="projects-container">
            <div class="projects-header">
                <h3><i class="fas fa-globe" style="margin-right: 10px;"></i> Сайты</h3>
                <span class="projects-count">9 проектов</span>
            </div>
            <div id="sites-scroll" class="projects-scroll"></div>
            <div id="detail-sites" class="detail-container"></div>
        </div>

        <div id="projects-bots" class="projects-container">
            <div class="projects-header">
                <h3><i class="fas fa-robot" style="margin-right: 10px;"></i> Боты</h3>
                <span class="projects-count">6 проектов</span>
            </div>
            <div id="bots-scroll" class="projects-scroll"></div>
            <div id="detail-bots" class="detail-container"></div>
        </div>

        <div id="projects-automations" class="projects-container">
            <div class="projects-header">
                <h3><i class="fas fa-magic" style="margin-right: 10px;"></i> Автоматизации</h3>
                <span class="projects-count">5 решений</span>
            </div>
            <div id="automations-scroll" class="projects-scroll"></div>
            <div id="detail-automations" class="detail-container"></div>
        </div>

        <!-- НЕОНОВАЯ КЛАВИАТУРА -->
        <div class="contact-section">
            <div class="contact-title">
                <i class="fas fa-bolt"></i> СВЯЗАТЬСЯ <i class="fas fa-bolt"></i>
            </div>
            <ul class="neon-keyboard">
                <li class="neon-key">
                    <a href="#">
                        <i class="fab fa-telegram"></i>
                        <span>Telegram</span>
                    </a>
                </li>
                <li class="neon-key">
                    <a href="#">
                        <i class="fab fa-whatsapp"></i>
                        <span>WhatsApp</span>
                    </a>
                </li>
                <li class="neon-key">
                    <a href="#">
                        <i class="far fa-envelope"></i>
                        <span>Email</span>
                    </a>
                </li>
                <li class="neon-key">
                    <a href="#">
                        <i class="fab fa-github"></i>
                        <span>GitHub</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // --- 3D НЕОНОВЫЙ ФОН ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;
        camera.position.y = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 100;
            posArray[i+1] = (Math.random() - 0.5) * 100;
            posArray[i+2] = (Math.random() - 0.5) * 100 - 30;

            const isCyan = Math.random() > 0.5;
            colorArray[i] = isCyan ? 0 : 1;
            colorArray[i+1] = isCyan ? 1 : 0;
            colorArray[i+2] = isCyan ? 1 : 1;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.2,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        const torusGeo = new THREE.TorusGeometry(8, 0.3, 16, 100);
        const torusMat = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            wireframe: true,
            transparent: true,
            opacity: 0.08,
            blending: THREE.AdditiveBlending
        });
        const torus = new THREE.Mesh(torusGeo, torusMat);
        torus.position.z = -25;
        torus.rotation.x = 1;
        torus.rotation.y = 0.5;
        scene.add(torus);

        const torus2 = new THREE.Mesh(torusGeo, torusMat);
        torus2.material.color.setHex(0xff00ff);
        torus2.position.z = -35;
        torus2.rotation.x = 1.5;
        torus2.rotation.y = 1;
        torus2.scale.set(1.2, 1.2, 1.2);
        scene.add(torus2);

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.0002;
            particlesMesh.rotation.x += 0.0001;
            torus.rotation.y += 0.0008 + mouseX * 0.005;
            torus.rotation.x += 0.0005 + mouseY * 0.005;
            torus2.rotation.y -= 0.0005;
            torus2.rotation.x += 0.0008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- КУРСОР ---
        const cursor = document.getElementById('neonCursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // --- ДАННЫЕ ПРОЕКТОВ ---
        const projectsData = {
            sites: [
                {
                    id: 1,
                    title: "Гостевой дом "Афины"",
                    icon: "fa-hotel",
                    description: "Полноценный сайт для гостиницы с системой онлайн-бронирования.",
                    tags: ["HTML5", "Tailwind CSS", "Google Fonts", "Yandex Maps API"],

                    tags: ["Vue 3", "GSAP", "Three.js"],

                },
                {

                    tags: ["React", "Shader", "CSS Houdini"],

                    tech: ["React", "Three.js", "GLSL"],

                }
            ],
            bots: [
                {

                {

                },
                {

                    icon: "fa-spray-can-sparkles",
                    description: "Бот для Telegram-пабликов: по названию парфюма генерирует эстетичный пост с фотографией, описанием и характеристиками.",
                    tags: ["Node.js", "Telegraf", "OpenAI"],

                    tech: ["Node.js", "OpenAI API", "Unsplash API"],

                }
            ],
            automations: [
                {
                    id: 7,
                    title: "Контроль сроков документов",
                    icon: "fa-clock",
                    description: "Автоматическая проверка Google Sheets, формирование отчётов и отправка напоминаний сотрудникам.",
                    tags: ["Python", "Schedule", "Telegram"],
                    features: ["Ежедневная проверка", "Персонализация", "Excel отчёты"],
                    tech: ["Python", "Pandas", "Telegram Bot"],
                    screenshots: ["auto1", "auto2"]
                },
                {
                    id: 8,
                    title: "Email → Airtable",
                    icon: "fa-inbox",
                    description: "Импорт данных из входящих писем и PDF-вложений в Airtable с автоматической обработкой.",
                    tags: ["Make", "Python", "Airtable API"],
                    features: ["Парсинг писем", "Структурирование", "Webhooks"],
                    tech: ["Python", "IMAP", "Airtable"],
                    screenshots: ["email1", "email2"]
                },
                {
                    id: 9,
                    title: "Постмейкер для брендов",
                    icon: "fa-wand-sparkles",
                    description: "Автоматический постинг в Telegram каналы с генерацией дизайна, хэштегов и уникальных описаний.",
                    tags: ["Node.js", "Figma API", "Telegraf"],
                    features: ["Шаблоны дизайна", "Расписание", "Аналитика"],
                    tech: ["Node.js", "Figma API", "Grammy"],
                    screenshots: ["post1", "post2"]
                }
            ]
        };

        // --- ПЕРЕМЕННЫЕ ДЛЯ УПРАВЛЕНИЯ АНИМАЦИЕЙ ---
        let isTransitioning = false;
        let pendingCategory = null;
        let pendingProject = null;

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function renderProjects() {
            const sitesScroll = document.getElementById('sites-scroll');
            sitesScroll.innerHTML = '';
            projectsData.sites.forEach(project => {
                sitesScroll.appendChild(createProjectCard(project, 'sites'));
            });

            const botsScroll = document.getElementById('bots-scroll');
            botsScroll.innerHTML = '';
            projectsData.bots.forEach(project => {
                botsScroll.appendChild(createProjectCard(project, 'bots'));
            });

            const automationsScroll = document.getElementById('automations-scroll');
            automationsScroll.innerHTML = '';
            projectsData.automations.forEach(project => {
                automationsScroll.appendChild(createProjectCard(project, 'automations'));
            });
        }

        function createProjectCard(project, category) {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.dataset.projectId = project.id;
            card.dataset.category = category;
            card.innerHTML = `
                <div class="project-icon"><i class="fas ${project.icon}"></i></div>
                <h4>${project.title}</h4>
                <p style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 0.5rem;">${project.description.substring(0, 70)}...</p>
                <div class="project-tags">
                    ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
                <div style="margin-top: 1rem; color: #00ffff; font-size: 0.85rem;">
                    <i class="fas fa-arrow-right"></i> Подробнее
                </div>
            `;

            card.addEventListener('click', (event) => {
                event.stopPropagation();

                if (isTransitioning) {
                    pendingProject = { project, category, card };
                    return;
                }

                const detailContainer = document.getElementById(`detail-${category}`);
                const isActive = card.classList.contains('active');

                if (isActive) {
                    closeDetailWithAnimation(detailContainer, () => {
                        card.classList.remove('active');
                    });
                } else {
                    // Убираем active со всех проектов
                    document.querySelectorAll('.project-card.active').forEach(el => {
                        el.classList.remove('active');
                    });

                    card.classList.add('active');

                    // Если уже есть открытая деталька - закрываем и открываем новую
                    if (detailContainer.classList.contains('active')) {
                        closeDetailWithAnimation(detailContainer, () => {
                            openProjectDetail(project, category);
                        });
                    } else {
                        // Закрываем детальки в других категориях
                        let hasOtherActive = false;
                        document.querySelectorAll('.detail-container.active').forEach(el => {
                            if (el.id !== `detail-${category}`) {
                                hasOtherActive = true;
                                closeDetailWithAnimation(el, () => {
                                    if (!document.querySelector('.detail-container.active')) {
                                        openProjectDetail(project, category);
                                    }
                                });
                            }
                        });

                        if (!hasOtherActive) {
                            openProjectDetail(project, category);
                        }
                    }
                }
            });

            return card;
        }

        function closeDetailWithAnimation(detailContainer, callback) {
            if (!detailContainer || !detailContainer.classList.contains('active')) {
                if (callback) callback();
                return;
            }

            isTransitioning = true;
            detailContainer.classList.add('closing');

            setTimeout(() => {
                detailContainer.classList.remove('active');
                detailContainer.classList.remove('closing');
                detailContainer.innerHTML = '';

                isTransitioning = false;

                if (pendingProject) {
                    const { project, category, card } = pendingProject;
                    pendingProject = null;

                    document.querySelectorAll('.project-card.active').forEach(el => {
                        el.classList.remove('active');
                    });
                    card.classList.add('active');
                    openProjectDetail(project, category);
                } else if (pendingCategory) {
                    const { category } = pendingCategory;
                    pendingCategory = null;
                    performOpenCategory(category);
                }

                if (callback) callback();
            }, 500);
        }

        function openProjectDetail(project, category) {
            const detailContainer = document.getElementById(`detail-${category}`);

            detailContainer.innerHTML = `
                <div class="detail-card">
                    <div class="screenshot-area">
                        <div class="main-shot">
                            <i class="fas ${project.icon}" style="font-size: 5rem; color: rgba(0,255,255,0.5);"></i>
                        </div>
                        <div class="thumbnails-row">
                            ${project.screenshots.map(() => `
                                <div class="thumb">
                                    <i class="fas fa-image"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="project-detail-info">
                        <div class="detail-title">${project.title}</div>
                        <div class="detail-desc">${project.description}</div>
                        <div>
                            <h4 style="margin-bottom: 0.8rem; color: #ff00ff; font-size: 1.1rem;">Технологии</h4>
                            <div class="tech-list">
                                ${project.tech.map(t => `<span class="tech-item">${t}</span>`).join('')}
                            </div>
                        </div>
                        <div>
                            <h4 style="margin-bottom: 0.8rem; color: #00ffff; font-size: 1.1rem;">Возможности</h4>
                            <ul class="feature-list">
                                ${project.features.map(f => `<li><i class="fas fa-bolt"></i> ${f}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `;

            detailContainer.classList.add('active');
        }

        // --- ЛОГИКА КАТЕГОРИЙ С АНИМАЦИЕЙ ПЕРЕХОДА ---
        const categoryCards = document.querySelectorAll('.category-card');
        const projectContainers = {
            sites: document.getElementById('projects-sites'),
            bots: document.getElementById('projects-bots'),
            automations: document.getElementById('projects-automations')
        };

        function closeProjectsWithAnimation(container, callback) {
            if (!container || !container.classList.contains('active')) {
                if (callback) callback();
                return;
            }

            isTransitioning = true;
            container.classList.add('closing');

            const detailId = container.id.replace('projects', 'detail');
            const detailContainer = document.getElementById(detailId);
            if (detailContainer && detailContainer.classList.contains('active')) {
                detailContainer.classList.add('closing');
                setTimeout(() => {
                    detailContainer.classList.remove('active');
                    detailContainer.classList.remove('closing');
                    detailContainer.innerHTML = '';
                }, 700);
            }

            setTimeout(() => {
                container.classList.remove('active');
                container.classList.remove('closing');

                isTransitioning = false;

                if (pendingCategory) {
                    const { category } = pendingCategory;
                    pendingCategory = null;
                    performOpenCategory(category);
                } else if (pendingProject) {
                    const { project, category, card } = pendingProject;
                    pendingProject = null;

                    document.querySelectorAll('.project-card.active').forEach(el => {
                        el.classList.remove('active');
                    });
                    card.classList.add('active');
                    openProjectDetail(project, category);
                }

                if (callback) callback();
            }, 700);
        }

        function performOpenCategory(category) {
            const container = projectContainers[category];

            container.classList.add('active');
            document.querySelector(`.category-card[data-category="${category}"]`).classList.add('active');
        }

        function openCategory(category) {
            const container = projectContainers[category];

            if (isTransitioning) {
                pendingCategory = { category };
                return;
            }

            // Если категория уже активна - закрываем
            if (container.classList.contains('active')) {
                closeProjectsWithAnimation(container, () => {
                    document.querySelector(`.category-card[data-category="${category}"]`).classList.remove('active');
                    document.querySelectorAll('.project-card.active').forEach(el => {
                        el.classList.remove('active');
                    });
                });
                return;
            }

            // Закрываем все открытые категории с анимацией
            let anyActive = false;
            Object.values(projectContainers).forEach(cont => {
                if (cont.classList.contains('active')) {
                    anyActive = true;
                    closeProjectsWithAnimation(cont);
                }
            });

            // Убираем active со всех карточек категорий
            categoryCards.forEach(card => card.classList.remove('active'));

            if (anyActive) {
                pendingCategory = { category };
            } else {
                performOpenCategory(category);
            }
        }

        categoryCards.forEach(card => {
            card.addEventListener('click', () => {
                const category = card.dataset.category;
                openCategory(category);
            });
        });

        renderProjects();

        window.addEventListener('load', () => {
            openCategory('sites');
        });

        // Эффекты на курсор
        document.querySelectorAll('.category-card, .project-card, .thumb, .neon-key a').forEach(el => {
            if (el) {
                el.addEventListener('mouseenter', () => {
                    cursor.style.width = '40px';
                    cursor.style.height = '40px';
                    cursor.style.borderColor = '#ff00ff';
                    cursor.style.boxShadow = '0 0 40px #ff00ff';
                });
                el.addEventListener('mouseleave', () => {
                    cursor.style.width = '25px';
                    cursor.style.height = '25px';
                    cursor.style.borderColor = '#00ffff';
                    cursor.style.boxShadow = '0 0 20px #00ffff';
                });
            }
        });
    </script>
